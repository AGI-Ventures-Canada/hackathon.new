name: CodeQL

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: "24 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b611370bb5703a7efb587f9a54174a68513d100b # v3
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@b611370bb5703a7efb587f9a54174a68513d100b # v3
