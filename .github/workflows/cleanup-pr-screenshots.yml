name: Cleanup PR Screenshots

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete screenshot release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Mirror the numeric guard used in pr-screenshots.yml.
          # GitHub controls this value, but validating keeps the tag shape
          # consistent and prevents the cleanup from ever running against
          # an unexpected tag pattern.
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::debug::PR_NUMBER not numeric (${PR_NUMBER}) — skipping"
            exit 0
          fi
          TAG="pr-${PR_NUMBER}-screenshots"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
