name: Publish CLI

on:
  push:
    branches: [main]
    tags:
      - 'cli-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd packages/cli && bun install --frozen-lockfile

      - name: Check for CLI changes since last release
        id: changes
        if: "!startsWith(github.ref, 'refs/tags/cli-v')"
        run: |
          LAST_TAG=$(git tag -l 'cli-v*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found, will publish"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$LAST_TAG"..HEAD -- packages/cli/ | head -1)
            if [ -n "$CHANGED" ]; then
              echo "CLI files changed since $LAST_TAG"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No CLI changes since $LAST_TAG, skipping"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Resolve next version
        if: "!startsWith(github.ref, 'refs/tags/cli-v') && steps.changes.outputs.changed == 'true'"
        id: version
        run: |
          cd packages/cli
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          NPM_OUTPUT=$(npm view "$PKG_NAME" version 2>&1) || {
            if echo "$NPM_OUTPUT" | grep -q "E404"; then
              NPM_OUTPUT="0.0.0"
            else
              echo "npm view failed: $NPM_OUTPUT"
              exit 1
            fi
          }
          NPM_VERSION="$NPM_OUTPUT"
          IFS='.' read -r NPM_MAJOR NPM_MINOR NPM_PATCH <<< "$NPM_VERSION"
          NPM_NEXT="$NPM_MAJOR.$NPM_MINOR.$((NPM_PATCH + 1))"
          NEW_VERSION=$(printf '%s\n%s' "$PKG_VERSION" "$NPM_NEXT" | sort -V | tail -1)
          if [ "$NEW_VERSION" = "$PKG_VERSION" ] && [ "$PKG_VERSION" != "$NPM_NEXT" ]; then
            echo "package.json $PKG_VERSION is ahead of npm $NPM_VERSION → publishing as-is"
          else
            echo "Bumping to $NEW_VERSION (package.json was $PKG_VERSION, npm latest $NPM_VERSION)"
            node -e "const p=require('./package.json'); p.version='$NEW_VERSION'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run CLI tests
        if: "startsWith(github.ref, 'refs/tags/cli-v') || steps.changes.outputs.changed == 'true'"
        run: bun test packages/cli/__tests__/

      - name: Type check
        if: "startsWith(github.ref, 'refs/tags/cli-v') || steps.changes.outputs.changed == 'true'"
        run: cd packages/cli && bunx tsc --noEmit

      - name: Build
        if: "startsWith(github.ref, 'refs/tags/cli-v') || steps.changes.outputs.changed == 'true'"
        run: cd packages/cli && bun run build

      - uses: actions/setup-node@v5
        if: "startsWith(github.ref, 'refs/tags/cli-v') || steps.changes.outputs.changed == 'true'"
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        if: "startsWith(github.ref, 'refs/tags/cli-v') || steps.changes.outputs.changed == 'true'"
        run: npm install -g npm@latest

      - name: Publish to npm
        if: "startsWith(github.ref, 'refs/tags/cli-v') || steps.changes.outputs.changed == 'true'"
        run: cd packages/cli && npm publish --access public

      - name: Get version for tag-triggered runs
        if: "startsWith(github.ref, 'refs/tags/cli-v')"
        id: tag-version
        run: echo "version=${GITHUB_REF#refs/tags/cli-v}" >> "$GITHUB_OUTPUT"

      - name: Tag release and push version bump
        if: "!startsWith(github.ref, 'refs/tags/cli-v') && steps.changes.outputs.changed == 'true'"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet packages/cli/package.json; then
            git add packages/cli/package.json
            git commit -m "chore(cli): bump version to ${{ steps.version.outputs.version }}"
            git push origin main
          fi
          TAG="cli-v${{ steps.version.outputs.version }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: "startsWith(github.ref, 'refs/tags/cli-v') || steps.changes.outputs.changed == 'true'"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version || steps.tag-version.outputs.version }}
        run: |
          gh release create "cli-v${VERSION}" \
            --title "CLI v${VERSION}" \
            --generate-notes \
            --notes-start-tag "$(git tag -l 'cli-v*' --sort=-v:refname | sed -n '2p')"
