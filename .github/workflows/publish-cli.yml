name: Publish CLI

on:
  push:
    branches: [main]

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd packages/cli && bun install --frozen-lockfile

      - name: Check for CLI changes since last release
        id: changes
        run: |
          LAST_TAG=$(git tag -l 'cli-v*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found, will publish"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$LAST_TAG"..HEAD -- packages/cli/ | head -1)
            if [ -n "$CHANGED" ]; then
              echo "CLI files changed since $LAST_TAG"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No CLI changes since $LAST_TAG, skipping"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Resolve next version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: |
          cd packages/cli
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          NPM_OUTPUT=$(npm view "$PKG_NAME" version 2>&1) || {
            if echo "$NPM_OUTPUT" | grep -q "E404"; then
              NPM_OUTPUT="0.0.0"
            else
              echo "npm view failed: $NPM_OUTPUT"
              exit 1
            fi
          }
          NPM_VERSION="$NPM_OUTPUT"
          IFS='.' read -r NPM_MAJOR NPM_MINOR NPM_PATCH <<< "$NPM_VERSION"
          NPM_NEXT="$NPM_MAJOR.$NPM_MINOR.$((NPM_PATCH + 1))"
          HIGHEST_VERSION=$(printf '%s\n%s' "$PKG_VERSION" "$NPM_NEXT" | sort -V | tail -1)
          if [ "$HIGHEST_VERSION" != "$PKG_VERSION" ] || [ "$PKG_VERSION" = "$NPM_VERSION" ]; then
            echo "packages/cli/package.json must be bumped in a pull request before publishing"
            echo "package.json: $PKG_VERSION; npm: $NPM_VERSION; minimum next version: $NPM_NEXT"
            exit 1
          fi
          NEW_VERSION="$PKG_VERSION"
          echo "Publishing package.json version $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run CLI tests
        if: steps.changes.outputs.changed == 'true'
        run: bun cli:test

      - name: Type check
        if: steps.changes.outputs.changed == 'true'
        run: cd packages/cli && bunx tsc --noEmit

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: cd packages/cli && bun run build

      - name: Pack reviewed CLI artifact
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/cli-package"
          cd packages/cli
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/cli-package"

      - name: Upload reviewed CLI artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-package-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/cli-package/*.tgz
          if-no-files-found: error

  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download reviewed CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-package-${{ needs.prepare.outputs.version }}
          path: cli-package

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@12.0.2

      - name: Publish to npm
        run: npm publish cli-package/*.tgz --provenance --access public --ignore-scripts

      - name: Tag release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          TAG="cli-v${VERSION}"
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${GITHUB_SHA}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "cli-v${VERSION}" \
            --title "CLI v${VERSION}" \
            --generate-notes
