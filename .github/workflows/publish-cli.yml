name: Publish CLI

on:
  push:
    branches: [main]
    tags:
      - "cli-v*"
  workflow_dispatch:

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd packages/cli && bun install --frozen-lockfile

      - name: Check for CLI changes since last release
        id: changes
        if: "!startsWith(github.ref, 'refs/tags/cli-v')"
        run: |
          LAST_TAG=$(git tag -l 'cli-v*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found, will publish"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$LAST_TAG"..HEAD -- packages/cli/ | head -1)
            if [ -n "$CHANGED" ]; then
              echo "CLI files changed since $LAST_TAG"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No CLI changes since $LAST_TAG, skipping"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Resolve next version
        if: "!startsWith(github.ref, 'refs/tags/cli-v') && steps.changes.outputs.changed == 'true'"
        id: version
        run: |
          cd packages/cli
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          NPM_OUTPUT=$(npm view "$PKG_NAME" version 2>&1) || {
            if echo "$NPM_OUTPUT" | grep -q "E404"; then
              NPM_OUTPUT="0.0.0"
            else
              echo "npm view failed: $NPM_OUTPUT"
              exit 1
            fi
          }
          NPM_VERSION="$NPM_OUTPUT"
          IFS='.' read -r NPM_MAJOR NPM_MINOR NPM_PATCH <<< "$NPM_VERSION"
          NPM_NEXT="$NPM_MAJOR.$NPM_MINOR.$((NPM_PATCH + 1))"
          HIGHEST_VERSION=$(printf '%s\n%s' "$PKG_VERSION" "$NPM_NEXT" | sort -V | tail -1)
          if [ "$HIGHEST_VERSION" != "$PKG_VERSION" ] || [ "$PKG_VERSION" = "$NPM_VERSION" ]; then
            echo "packages/cli/package.json must be bumped in a pull request before publishing"
            echo "package.json: $PKG_VERSION; npm: $NPM_VERSION; minimum next version: $NPM_NEXT"
            exit 1
          fi
          NEW_VERSION="$PKG_VERSION"
          echo "Publishing package.json version $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run CLI tests
        if: "startsWith(github.ref, 'refs/tags/cli-v') || steps.changes.outputs.changed == 'true'"
        run: bun cli:test

      - name: Type check
        if: "startsWith(github.ref, 'refs/tags/cli-v') || steps.changes.outputs.changed == 'true'"
        run: cd packages/cli && bunx tsc --noEmit

      - name: Build
        if: "startsWith(github.ref, 'refs/tags/cli-v') || steps.changes.outputs.changed == 'true'"
        run: cd packages/cli && bun run build

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: "startsWith(github.ref, 'refs/tags/cli-v') || steps.changes.outputs.changed == 'true'"
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        if: "startsWith(github.ref, 'refs/tags/cli-v') || steps.changes.outputs.changed == 'true'"
        run: npm install -g npm@latest

      - name: Publish to npm
        if: "startsWith(github.ref, 'refs/tags/cli-v') || steps.changes.outputs.changed == 'true'"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: cd packages/cli && npm publish --provenance --access public

      - name: Get version for tag-triggered runs
        if: "startsWith(github.ref, 'refs/tags/cli-v')"
        id: tag-version
        run: echo "version=${GITHUB_REF#refs/tags/cli-v}" >> "$GITHUB_OUTPUT"

      - name: Tag release
        if: "!startsWith(github.ref, 'refs/tags/cli-v') && steps.changes.outputs.changed == 'true'"
        run: |
          TAG="cli-v${{ steps.version.outputs.version }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: "startsWith(github.ref, 'refs/tags/cli-v') || steps.changes.outputs.changed == 'true'"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version || steps.tag-version.outputs.version }}
        run: |
          gh release create "cli-v${VERSION}" \
            --title "CLI v${VERSION}" \
            --generate-notes \
            --notes-start-tag "$(git tag -l 'cli-v*' --sort=-v:refname | sed -n '2p')"
