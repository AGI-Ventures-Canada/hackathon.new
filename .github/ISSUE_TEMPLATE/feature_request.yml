name: Feature request
description: Suggest a useful improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: outcome
    attributes:
      label: What should a user be able to do?
      description: Describe the outcome, not just a screen or technical solution.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Who is this for?
      multiple: true
      options:
        - Organizer
        - Attendee
        - Sponsor
        - Judge
        - Mentor
        - Developer
    validations:
      required: true
  - type: textarea
    id: parity
    attributes:
      label: How should this work in the app, WebMCP, CLI, and API?
      description: Note any surface that does not apply and explain why.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: More context
      description: Remove secrets and personal data before adding examples or screenshots.
