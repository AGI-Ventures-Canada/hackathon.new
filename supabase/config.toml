# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "oatmeal"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54422
shadow_port = 54420
major_version = 17

[db.pooler]
enabled = false
port = 54429
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
# Disabled to cut local RAM: no app code uses realtime channels.
# Re-enable with `enabled = true` if you add channel subscriptions.
enabled = false

[studio]
enabled = true
port = 54423
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54426

[storage]
enabled = true
# Acts as the platform-wide ceiling for every bucket — no bucket below can
# declare a higher limit than this. Sized to the largest bucket (exports at
# 500MiB). New buckets must declare their own `file_size_limit` explicitly;
# do not rely on this as a default.
file_size_limit = "500MiB"

[storage.s3_protocol]
# Disabled to cut local RAM: uploads use the storage HTTP API, not S3.
enabled = false

[storage.buckets.logos]
public = true
file_size_limit = "50MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/svg+xml"]

[storage.buckets.banners]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.screenshots]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.headshots]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.exports]
public = false
file_size_limit = "500MiB"
allowed_mime_types = ["application/zip"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
# Disabled to cut local RAM: repo has no supabase/functions to serve.
enabled = false
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
# Disabled to cut local RAM: log analytics aren't needed for local dev.
# Use `supabase inspect db` or Studio when debugging queries.
enabled = false
port = 54427
backend = "postgres"

[remotes.staging]
project_id = "osafhzpipoohnodavbiq"
